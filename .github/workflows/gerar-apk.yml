name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf pacote projeto
          mkdir -p pacote projeto

          echo "Extraindo pacote principal..."
          unzip -o TAXI_SC_ANDROID_ALARME_V13.zip -d pacote

          INNER_ZIP="$(find pacote -type f -name 'TAXI_SC_ANDROID_ALARME_V13.zip' | head -n 1)"

          if [ -z "$INNER_ZIP" ]; then
            echo "ERRO: ZIP interno do projeto não encontrado."
            find pacote -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ZIP interno encontrado:"
          echo "$INNER_ZIP"

          echo "Extraindo projeto Android..."
          unzip -o "$INNER_ZIP" -d projeto

          PROJECT_DIR="$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: settings.gradle não encontrado no projeto Android."
            find projeto -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Projeto Android encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK assinado
        shell: bash
        run: |
          set -e

          gradle -p "$PROJECT_DIR" --no-daemon assembleRelease

          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" app-debug.apk

          echo "APK criado:"
          ls -lh app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXI-SC-TESTE-APK
          path: app-debug.apk
